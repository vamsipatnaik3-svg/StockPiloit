
services:
  db:
    image: postgres:16
    container_name: stockpilot-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: local_dev_password_change_me

    ports:
      - "5433:5432"

    volumes:
      - stockpilot_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot -d stockpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tavuno-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - tavuno_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stockpilot_postgres_data:
  tavuno_redis_data:
